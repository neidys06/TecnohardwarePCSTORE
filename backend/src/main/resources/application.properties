# =============================================================================
# TecniHardware PC Store · Configuración base (común a todos los perfiles)
# Perfil por defecto: h2,demo (sin instalar nada). Para MySQL: perfil dev. Ver application-*.properties
# =============================================================================
spring.application.name=servicio-tecnico
spring.profiles.default=h2,demo
# En la nube (Railway, Render…) el puerto llega en la variable PORT
server.port=${PORT:8080}

# Zona horaria del negocio (Cúcuta, Colombia)
app.zona-horaria=America/Bogota
spring.jackson.time-zone=America/Bogota

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Archivos: fotos de evidencia 5 MB c/u (RF-08), lista de precios PDF 3 MB (RF-13)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB
app.archivos.carpeta=./archivos
app.archivos.foto-max-bytes=5242880
app.archivos.pdf-max-bytes=3145728
app.archivos.fotos-por-carga=10

# Seguridad (RNF-09)
app.seguridad.jwt-secreto=${JWT_SECRETO:solo-desarrollo-cambiar-en-produccion-0123456789abcdef}
app.seguridad.sesion-horas=12
app.seguridad.cookie-segura=false
app.seguridad.bcrypt-costo=12
app.seguridad.max-intentos=5
app.seguridad.minutos-bloqueo=15
# Contraseña TEMPORAL de la cuenta del Administrador que se crea al iniciar por primera vez (RF-02, RF-17)
# Personal que recibe y entrega los equipos en el local (Acta 5)
app.tienda.personal=Gloria Rojas Rivera,Dichel Susana Rojas Rivera

app.admin.usuario=admin
app.admin.nombre=Gloria Rojas
app.admin.clave-inicial=${ADMIN_CLAVE:Temporal2026}

# Documentación de la API
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Monitoreo
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.nombre=Servicio técnico TecniHardware PC Store
info.app.version=1.0.0
