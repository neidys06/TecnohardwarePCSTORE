# Producción: todo llega por variables de entorno.
#   DB_URL=jdbc:mysql://host:3306/tecnihardware?useSSL=false&allowPublicKeyRetrieval=true
#   (o jdbc:postgresql://host:5432/tecnihardware).
# Detrás del proxy HTTPS de la nube: respeta X-Forwarded-Proto/Host
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
# Por defecto Hibernate crea el esquema la primera vez y luego solo agrega columnas nuevas.
# Si el esquema se creó con db/01_esquema.sql y el usuario th_app (sin permisos DDL), usar DDL_AUTO=none.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
app.seguridad.jwt-secreto=${JWT_SECRETO}
app.seguridad.cookie-segura=true
app.archivos.carpeta=${CARPETA_ARCHIVOS:/var/lib/tecnihardware/archivos}
logging.level.root=WARN
logging.level.co.tecnihardware=INFO
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
