# Desarrollo con MySQL local. Crear la base una vez con db/00_crear_base.sql
# (en MySQL Workbench). Usuario y clave por variables DB_USER y DB_PASS.
spring.datasource.url=jdbc:mysql://localhost:3306/tecnihardware?serverTimezone=America/Bogota&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.co.tecnihardware=DEBUG

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
