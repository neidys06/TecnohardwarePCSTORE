# Demostración sin instalar MySQL: base H2 en un archivo local (./datos-h2).
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2,demo
spring.datasource.url=jdbc:h2:file:./datos-h2/tecnihardware;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
logging.level.co.tecnihardware=DEBUG
