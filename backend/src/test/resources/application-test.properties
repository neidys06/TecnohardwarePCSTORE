# Pruebas: H2 en memoria, se crea y se borra en cada ejecución.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.seguridad.bcrypt-costo=4
app.archivos.carpeta=${java.io.tmpdir}/tecnihardware-pruebas
app.tareas.habilitadas=false
