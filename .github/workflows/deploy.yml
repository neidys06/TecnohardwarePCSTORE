# Despliegue continuo en Oracle Cloud (recomendación del docente):
# cuando el CI de main termina bien, se compila la aplicación, se construye la imagen
# (amd64 y arm64), se sube al registro de GitHub (ghcr.io) y la máquina virtual la descarga.
# Se activa solo cuando existe la variable del repositorio VM_HOST (ver deploy/README.md).
name: CD · Despliegue en Oracle Cloud

on:
  workflow_run:
    workflows: ['CI · Build y pruebas']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  desplegar:
    if: ${{ vars.VM_HOST != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar el frontend
        run: |
          npm ci
          npm run build:api

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compilar el JAR (las pruebas ya corrieron en el CI)
        working-directory: backend
        run: mvn -B -q clean package -DskipTests

      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Ingresar al registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Copiar la configuración a la máquina
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER || 'ubuntu' }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/Caddyfile,deploy/respaldo.sh
          target: tecnihardware
          strip_components: 1

      - name: Actualizar la aplicación en la máquina
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER || 'ubuntu' }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/tecnihardware
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull app
            docker compose up -d
            docker logout ghcr.io
            docker image prune -f
